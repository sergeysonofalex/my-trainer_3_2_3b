<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажер: Фоны и Циклы в Scratch 3</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Verdana,Arial,sans-serif;
    background:linear-gradient(135deg,#4a3ac4 0%,#7c4dff 45%,#4c97ff 100%);
    background-attachment:fixed;
    min-height:100vh;padding:16px 16px 40px;
    display:flex;justify-content:center;align-items:flex-start;
    color:#2c2c3a;
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
    -webkit-touch-callout:none;
  }
  .app{width:100%;max-width:1080px;margin:0 auto;}
  .screen{display:none;animation:fade .3s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{
    background:#fff;border-radius:26px;padding:26px 30px 30px;
    box-shadow:0 18px 45px rgba(30,20,80,.35);
  }

  /* ---------- ЭКРАН 1 ---------- */
  .start-card{max-width:720px;margin:30px auto 0;text-align:center;}
  .logo-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .logo-row .blk{font-size:15px;padding:8px 14px;}
  h1{font-size:29px;line-height:1.25;color:#5b3fd6;margin-bottom:8px;}
  .sub{font-size:16px;color:#8a86a8;margin-bottom:26px;font-weight:600;}
  .label-name{display:block;font-size:19px;font-weight:800;color:#3a3a55;margin-bottom:10px;}
  #nameInput{
    width:100%;max-width:420px;margin:0 auto 22px;display:block;
    font-size:22px;font-weight:700;padding:13px 18px;border-radius:16px;
    border:3px solid #28a745;
    box-shadow:0 0 12px rgba(40,167,69,.4);
    outline:none;text-align:center;color:#2c2c3a;background:#f7fff9;
    transition:.2s;
  }
  #nameInput:focus{box-shadow:0 0 18px rgba(40,167,69,.65);}
  .warn{font-size:14px;color:#a0a0b8;margin-top:12px;font-weight:600;min-height:18px;}

  /* ---------- КНОПКИ ---------- */
  .btn{
    font-family:inherit;font-size:20px;font-weight:800;color:#fff;
    border:none;border-radius:16px;padding:14px 34px;cursor:pointer;
    transition:.15s;letter-spacing:.3px;
  }
  .btn:active{transform:translateY(2px);}
  .btn-green{background:linear-gradient(180deg,#34c759,#22a34a);box-shadow:0 5px 0 #1a7d38;}
  .btn-green:disabled{background:#cfd4dd;box-shadow:0 5px 0 #b5bac4;cursor:not-allowed;color:#8d94a3;}
  .btn-blue{background:linear-gradient(180deg,#5aa9ff,#3d7fe0);box-shadow:0 5px 0 #2a5fae;}
  .btn-purple{background:linear-gradient(180deg,#9d7bff,#7c4dff);box-shadow:0 5px 0 #5b34c4;}
  .btn-hint{
    background:linear-gradient(180deg,#ffd24d,#f5b400);color:#5a4000;
    box-shadow:0 5px 0 #c99300;font-size:17px;padding:11px 22px;
  }
  .btn-hint:disabled{opacity:.55;cursor:not-allowed;}

  /* ---------- ЭКРАН 2 ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .who{font-size:18px;font-weight:800;color:#5b3fd6;background:#f1ecff;padding:8px 16px;border-radius:14px;}
  .tasknum{font-size:17px;font-weight:800;color:#3a3a55;}
  .tasknum b{color:#7c4dff;font-size:21px;}
  .bar{height:18px;background:#ececf6;border-radius:12px;overflow:hidden;margin-bottom:22px;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
  .bar > i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,#28a745,#7c4dff);transition:width .35s ease;}

  .q-text{font-size:21px;font-weight:800;line-height:1.4;margin-bottom:18px;color:#252540;}

  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    width:100%;text-align:left;font-family:inherit;font-size:19px;font-weight:600;
    padding:15px 20px;border-radius:16px;border:3px solid #dcdcf0;background:#fff;
    color:#2c2c3a;cursor:pointer;transition:.14s;
  }
  .opt:hover:not(:disabled){border-color:#7c4dff;background:#faf7ff;transform:translateX(4px);}
  .opt.sel{border-color:#7c4dff;background:#f0e9ff;box-shadow:0 0 0 4px rgba(124,77,255,.18);}
  .opt.correct{border-color:#28a745;background:#e9f9ee;}
  .opt.wrong{border-color:#e74c3c;background:#fdecea;}
  .opt:disabled{cursor:default;}
  .opts.tf{flex-direction:row;}
  .opts.tf .opt{justify-content:center;font-size:21px;font-weight:800;}

  /* ---------- Scratch-блоки ---------- */
  .blk{
    display:inline-block;padding:7px 15px;border-radius:8px;
    color:#fff;font-weight:800;font-size:17px;line-height:1.25;
    box-shadow:0 3px 0 rgba(0,0,0,.22);
    white-space:normal;
  }
  .blk-events{background:#ffbf00;color:#4a3400;box-shadow:0 3px 0 #c08f00;}
  .blk-control{background:#ffab19;color:#4a2a00;box-shadow:0 3px 0 #c47c00;}
  .blk-looks{background:#9966ff;color:#fff;box-shadow:0 3px 0 #6f3fd6;}

  /* ---------- Drag & Drop ---------- */
  .pool{
    display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:12px;
    border-radius:16px;background:#f5f3ff;border:2px dashed #cbc3f5;margin-bottom:18px;
  }
  .chip{
    padding:10px 16px;border-radius:12px;background:#fff;border:3px solid #b9b9d4;
    font-size:17px;font-weight:700;cursor:grab;transition:.14s;color:#2c2c3a;
  }
  .chip:hover{border-color:#7c4dff;transform:translateY(-2px);}
  .chip.sel{border-color:#7c4dff;background:#efe9ff;box-shadow:0 0 0 4px rgba(124,77,255,.2);}
  .chip.wrong{border-color:#e74c3c;background:#fdecea;}
  .chip.dragging{opacity:.4;}
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
  .zone{
    border:3px dashed var(--zc,#b9b9d4);border-radius:16px;padding:10px;
    min-height:130px;background:#fafaff;
  }
  .zone-title{
    font-weight:900;font-size:17px;margin-bottom:8px;text-align:center;
    color:var(--zc,#5b3fd6);
  }
  .zone-body{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;align-content:flex-start;}

  /* ---------- Соответствие ---------- */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .mcol{display:flex;flex-direction:column;gap:12px;}
  .mitem{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;
    border:3px solid #eaeaf6;background:#fafaff;cursor:pointer;transition:.14s;
  }
  .mitem:hover{border-color:#c9c2f0;}
  .mitem.sel{border-color:#7c4dff;background:#efe9ff;box-shadow:0 0 0 4px rgba(124,77,255,.15);}
  .mitem.linked{background:#eaf7ff;border-color:#9dd2ff;}
  .mitem .plain{font-size:17px;font-weight:700;color:#2c2c3a;}
  .badge{
    width:32px;height:32px;border-radius:50%;background:#7c4dff;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;
    flex:0 0 auto;font-size:16px;
  }
  .badge.empty{background:#d9d9e8;color:#9a9ab8;}

  /* ---------- Порядок ---------- */
  .script-area{
    min-height:130px;border-radius:16px;background:#f5f3ff;border:2px dashed #cbc3f5;
    padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
  }
  .script-empty{color:#a29cc4;font-size:16px;text-align:center;padding:26px 10px;font-weight:600;}
  .order-pool{flex-direction:column;align-items:flex-start;}
  .order-pool .blk{cursor:pointer;transition:.14s;}
  .order-pool .blk:hover{transform:translateX(4px);}
  .script-area .blk{cursor:pointer;}

  /* ---------- Обратная связь ---------- */
  .hintrow{margin-top:18px;}
  .hint-box{
    margin-top:12px;padding:14px 18px;border-radius:14px;font-size:17px;font-weight:600;
    background:#fff8e1;border:3px solid #ffd24d;color:#6b4d00;line-height:1.4;
  }
  .feedback{margin-top:18px;padding:16px 20px;border-radius:16px;font-size:18px;line-height:1.4;}
  .feedback.good{background:#e9f9ee;border:3px solid #28a745;}
  .feedback.bad{background:#fdecea;border:3px solid #e74c3c;}
  .fb-title{font-weight:900;font-size:20px;margin-bottom:6px;}
  .feedback.good .fb-title{color:#1e7a37;}
  .feedback.bad .fb-title{color:#b52d1e;}
  .fb-text{font-weight:600;color:#3a3a55;}

  .actions{margin-top:22px;display:flex;justify-content:center;gap:14px;}

  /* ---------- ЭКРАН 3 ---------- */
  .finish-head{text-align:center;margin-bottom:22px;}
  .finish-head h1{font-size:28px;}
  .finish-sub{font-size:17px;color:#7d7a99;font-weight:600;margin-top:6px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0 26px;}
  .stat{
    border-radius:18px;padding:18px 12px;text-align:center;background:#f6f5ff;border:3px solid #e5e2ff;
  }
  .stat b{display:block;font-size:34px;line-height:1.1;}
  .stat span{font-size:15px;font-weight:800;color:#7d7a99;}
  .stat.good b{color:#28a745;} .stat.bad b{color:#e74c3c;} .stat.total b{color:#7c4dff;}
  h3{font-size:20px;color:#5b3fd6;margin-bottom:14px;}
  .mistake{
    border:3px solid #ffd8d3;background:#fff8f7;border-radius:16px;padding:14px 18px;margin-bottom:12px;
  }
  .m-num{font-weight:900;color:#e74c3c;font-size:16px;margin-bottom:4px;}
  .m-q{font-size:17px;font-weight:700;color:#2c2c3a;margin-bottom:8px;line-height:1.35;}
  .m-row{font-size:16px;font-weight:600;color:#3a3a55;margin-bottom:4px;line-height:1.4;}
  .lbl{font-weight:900;}
  .lbl.bad{color:#e74c3c;} .lbl.good{color:#28a745;}
  .m-exp{color:#5b3fd6;margin-top:6px;}
  .all-good{
    text-align:center;font-size:19px;font-weight:800;color:#1e7a37;
    background:#e9f9ee;border:3px solid #28a745;border-radius:18px;padding:22px;
  }
  .hidden{display:none !important;}

  @media (max-width:620px){
    h1{font-size:22px;}
    .q-text{font-size:18px;}
    .opt{font-size:17px;}
    .match{grid-template-columns:1fr;}
    .card{padding:18px;}
  }

body{font-family:"Segoe UI",Verdana,Arial,sans-serif;font-size:22px;color:#1f2a44;background-color:#fbfaf2;background-image:linear-gradient(#cde3f5 1.5px,transparent 1.5px),linear-gradient(90deg,#cde3f5 1.5px,transparent 1.5px);background-size:30px 30px;background-attachment:fixed}
.app{max-width:1200px}

h1{font-size:38px;color:#1f4fa3}.sub{font-size:21px;color:#5c6b8a}
.label-name{font-size:26px}#nameInput{font-size:28px;border-color:#2b5aa8;box-shadow:none;background:#fff}
.logo-row{background:#2f6b4f;border:8px solid #b07a3c;border-radius:12px;padding:22px 30px;align-items:center}
.logo-scr{text-align:left}.logo-row .cat{width:110px;height:110px}
.btn{font-size:26px;padding:16px 42px;border-radius:14px}
.btn-hint{font-size:21px;padding:12px 24px}

.bar{height:20px}.bar>i{background:linear-gradient(90deg,#4cbf56,#4c97ff)}
.q-text{font-size:29px;line-height:1.35;margin-bottom:20px}
.opt{font-size:24px;min-height:68px;border-color:#c9d6ee;border-radius:14px}
.opt:hover:not(:disabled){border-color:#4c97ff;background:#f1f7ff}.opt.sel{border-color:#2b5aa8;background:#e6efff;box-shadow:0 0 0 4px rgba(76,151,255,.25)}

.hint-box,.feedback{font-size:22px}.fb-title{font-size:24px}

.art{display:flex;justify-content:center;align-items:center;gap:16px;margin:0 0 18px;flex-wrap:wrap}
.stg{width:300px;max-width:100%;border:4px solid #4c97ff;border-radius:10px;background:#fff}
.tb{display:flex;flex-direction:column;gap:8px}.tb svg{width:38px;height:38px}
.th{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}.th b{font-size:30px;color:#4c97ff}
.t{border:4px solid #c9d6ee;border-radius:10px;padding:4px;background:#fff;text-align:center;font-weight:800}.t svg{width:150px;display:block}.t.hi{border-color:#4cbf56}
.tiles{display:flex;gap:14px}.tile{border:4px solid #c9d6ee;border-radius:10px;padding:6px;text-align:center;font-weight:800;background:#fff}.tile svg{width:90px;display:block}.tile.on{border-color:#4c97ff;background:#e6efff}
.pill{display:inline-block;color:#fff;font-weight:800;border-radius:8px;padding:5px 12px;font-size:21px;text-shadow:0 1px 1px rgba(0,0,0,.35)}.pill svg{vertical-align:middle;width:24px;height:24px}.plus{margin:0 8px;color:#5c6b8a}
.note{background:#eef6ff;border:3px dashed #4c97ff;border-radius:12px;padding:10px 16px;font-size:20px;font-weight:700;margin-bottom:14px}
/* Scratch 3 блоки */
.b{position:relative;display:block;width:max-content;margin-top:-6px;filter:drop-shadow(0 0 1px var(--d)) drop-shadow(0 0 1px var(--d));touch-action:none;cursor:grab;user-select:none}
.b:first-child{margin-top:0}
.bb{background:var(--c);color:#fff;font:700 23px/1.2 "Helvetica Neue",Helvetica,Arial,sans-serif;padding:12px 18px 18px;display:flex;align-items:center;gap:9px;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.3);clip-path:polygon(0 0,16px 0,22px 6px,38px 6px,44px 0,100% 0,100% calc(100% - 6px),44px calc(100% - 6px),38px 100%,22px 100%,16px calc(100% - 6px),0 calc(100% - 6px))}
.hat>.bb{border-radius:44px 44px 0 0/26px 26px 0 0;padding-top:28px;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),44px calc(100% - 6px),38px 100%,22px 100%,16px calc(100% - 6px),0 calc(100% - 6px))}
.b.c>.ct{clip-path:polygon(0 0,16px 0,22px 6px,38px 6px,44px 0,100% 0,100% calc(100% - 6px),60px calc(100% - 6px),54px 100%,38px 100%,32px calc(100% - 6px),0 calc(100% - 6px))}
.b.c>.cm{border-left:18px solid var(--c);min-height:34px;margin-top:-6px}
.cm>.b:first-child{margin-top:-6px}
.b.c>.cb{height:30px;padding:0;margin-top:-6px;border-radius:0 0 10px 10px;clip-path:polygon(0 0,34px 0,40px 6px,56px 6px,62px 0,100% 0,100% 100%,0 100%)}
.in{display:inline-block;min-width:36px;text-align:center;background:#fff;color:#444;border-radius:16px;padding:1px 10px;font-style:normal;font-size:21px;text-shadow:none}
.in.dd{border-radius:6px;background:#fff;color:#444;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.fl svg{width:28px;height:28px;display:block}.fl{display:inline-flex}
/* редактор скриптов */
.ed{display:flex;gap:0;border:3px solid #c9d6ee;border-radius:12px;overflow:hidden;background:#fff;margin-bottom:12px}
.cats{width:96px;background:#fff;border-right:2px solid #d9e3f2;padding:10px 4px;display:flex;flex-direction:column;gap:14px}
.cats div{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:700;color:#575e75;text-align:center;line-height:1.1}
.cats i{width:34px;height:34px;border-radius:50%;margin-bottom:3px;border:2px solid rgba(0,0,0,.15)}

.pal.over{background:#ffe9e9}.pe{color:#7a8aa8;font-weight:700;font-size:19px;text-align:center;margin-top:30px}

.drag{position:fixed;z-index:999;pointer-events:none;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.snapv{position:fixed;z-index:998;width:150px;height:10px;border-radius:5px;background:rgba(120,120,140,.55);display:none;pointer-events:none}

}

<body oncontextmenu="return false;">

<div class="app">

  <!-- ============ ЭКРАН 1 ============ -->
  <section id="screen-start" class="screen active">
    <div class="card start-card">
      <div class="logo-row">
        <span class="blk blk-events">когда флажок нажат</span>
        <span class="blk blk-control">повторять всегда</span>
        <span class="blk blk-looks">следующий фон</span>
      </div>
      <h1>Интерактивный тренажер:<br>Фоны и Циклы в Scratch 3</h1>
      <p class="sub">Цифровая грамотность · 3 класс · Урок 11</p>
      <label class="label-name" for="nameInput">Введи своё имя</label>
      <input id="nameInput" type="text" maxlength="20" autocomplete="off" spellcheck="false">
      <div>
        <button id="startBtn" class="btn btn-green" disabled>Начать тренажер</button>
      </div>
      <p class="warn" id="startWarn">Введи имя (минимум 2 буквы), чтобы начать</p>
    </div>
  </section>

  <!-- ============ ЭКРАН 2 ============ -->
  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="topbar">
        <div class="who">👦 <span id="studentName"></span></div>
        <div class="tasknum">Задание <b id="qNum">1</b> из <span id="qTotal">20</span></div>
      </div>
      <div class="bar"><i id="barFill"></i></div>

      <div id="questionArea"></div>

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;

}

 else if([5,6,10,12,16].indexOf(i)<0)a=stage(['forest','space','sea','desert','arctic'][i%5],c);

var CC={events:['#FFBF00','#CC9900'],control:['#FFAB19','#CF8B17'],looks:['#9966FF','#774DCB']};
function lab(t){return esc(t).replace(/(зелёный )?флажок/i,'<span class="fl">'+FLAG+'</span>').replace(/\[([^\]]+)\]/g,'<i class="in dd">$1 ▾</i>').replace(/(\d+) (секунд)/,'<i class="in">$1</i> $2');}

 return '<div class="b'+(n.k==='hat'?' hat':'')+'" '+x+'><div class="bb">'+lab(n.t)+'</div></div>';}
function bsingle(t,cat){return bhtml({id:-1,t:t,cat:cat,k:kind(t),inner:[]});}
function pillCat(t){return /флажок|клавиша/.test(t)?'events':(/повторять|ждать/.test(t)?'control':'looks');}

 if(t.indexOf(' + ')>0)return t.split(' + ').map(function(p){var c=CC[pillCat(p)];return '<span class="pill" style="background:'+c[0]+'">'+(/флажок/i.test(p)?FLAG+' ':'')+esc(p)+'</span>';}).join('<span class="plus">+</span>');
 return (OI[t]||'')+'<span>'+esc(t)+'</span>';}
function chipHTML(t){return (CHI[t]||'')+'<span>'+lab(t)+'</span>';}
function isDone(q){var c=state.cur;if(!c)return false;
 if(q.type==='mc'||q.type==='tf')return c.selected!==null;
 if(q.type==='dd')return c.items.every(function(i){return i.curZone!==null;});
 if(q.type==='match')return Object.keys(c.links).length===q.pairs.length;

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const state = {
  name: '',
  idx: 0,
  answers: [],
  cur: null,
  locked: false
};

/* =========================================================
   ЭЛЕМЕНТЫ
   ========================================================= */
const nameInput   = document.getElementById('nameInput');
const startBtn    = document.getElementById('startBtn');
const startWarn   = document.getElementById('startWarn');
const questionArea= document.getElementById('questionArea');
const feedbackEl  = document.getElementById('feedback');
const checkBtn    = document.getElementById('checkBtn');
const nextBtn     = document.getElementById('nextBtn');
const barFill     = document.getElementById('barFill');

/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
   ========================================================= */
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* =========================================================
   ЭКРАН 1: СТАРТ
   ========================================================= */
nameInput.addEventListener('input', function(){
  var v = nameInput.value.trim();
  var ok = v.length >= 2;
  startBtn.disabled = !ok;
  startWarn.style.visibility = ok ? 'hidden' : 'visible';
});
nameInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !startBtn.disabled) startBtn.click();
});
startBtn.addEventListener('click', function(){
  state.name = nameInput.value.trim();
  state.tries = 1; state.log = [];
  state.idx = 0;
  state.answers = [];
  state.locked = false;
  document.getElementById('studentName').textContent = state.name;
  document.getElementById('qTotal').textContent = QUESTIONS.length;
  show('screen-quiz');
  renderQuestion();
});

/* =========================================================
   РЕНДЕР ВОПРОСА
   ========================================================= */
function renderQuestion(){
  var q = QUESTIONS[state.idx];
  state.locked = false;

  document.getElementById('qNum').textContent = state.idx + 1;
  barFill.style.width = ((state.idx + 1) / QUESTIONS.length * 100) + '%';

  feedbackEl.className = 'feedback hidden';
  feedbackEl.innerHTML = '';
  checkBtn.classList.add('hidden');
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = 'Далее →';

  if (q.type === 'mc')        questionArea.innerHTML = renderMC(q);
  else if (q.type === 'tf')   questionArea.innerHTML = renderTF(q);
  else if (q.type === 'dd')   questionArea.innerHTML = renderDD(q);
  else if (q.type === 'match')questionArea.innerHTML = renderMatch(q);
  else if (q.type === 'order')questionArea.innerHTML = renderOrder(q);

  if (q.type === 'dd')    paintDD(q);
  if (q.type === 'match') paintMatch(q);
  if (q.type === 'order') paintOrder(q);
  var qt = questionArea.querySelector('.q-text');
  if (qt) qt.insertAdjacentHTML('beforebegin', artFor(QUESTIONS[state.idx]._i));
  if (q.type === 'dd' && qt) qt.insertAdjacentHTML('afterend','<div class="note">👆 Нажми на карточку, потом на нужную колонку (или перетащи). Вернуть — нажать на карточку в колонке.</div>');
}

function optInner(o){
  if (o.blk) return bsingle(o.t,o.blk);
  return plainOpt(o.t);
}

function renderMC(q){
  var opts = shuffle(q.options.map(function(o, i){
    return { t:o.t, ok:o.ok, blk:o.blk, idx:i };
  }));
  state.cur = { type:'mc', options:opts, selected:null };
  var h = '<div class="q-text">' + esc(q.q) + '</div><div class="opts">';
  opts.forEach(function(o, i){
    h += '<button class="opt" data-i="' + i + '">' + optInner(o) + '</button>';
  });
  h += '</div>';
  return h;
}

function renderTF(q){
  var opts = [
    { t:'Верно ✓', ok: !!q.correct },
    { t:'Неверно ✗', ok: !q.correct }
  ];
  state.cur = { type:'tf', options:opts, selected:null };
  var h = '<div class="q-text">' + esc(q.q) + '</div><div class="opts tf">';
  opts.forEach(function(o, i){
    h += '<button class="opt" data-i="' + i + '">' + esc(o.t) + '</button>';
  });
  h += '</div>';
  return h;
}

function renderDD(q){
  var items = shuffle(q.items.map(function(it, i){
    return { t:it.t, z:it.z, id:i, curZone:null };
  }));
  state.cur = { type:'dd', items:items, sel:null };
  return '<div class="q-text">' + esc(q.q) + '</div>' +
         '<div class="pool" id="ddPool"></div>' +
         '<div class="zones" id="ddZones"></div>';
}

function chipEl(it){
  var d = document.createElement('div');
  d.className = 'chip';
  d.dataset.id = it.id;
  d.draggable = true;
  d.innerHTML = chipHTML(it.t);
  if (state.cur && state.cur.sel === it.id) d.classList.add('sel');
  return d;
}

function paintDD(q){
  var cur = state.cur;
  var pool = document.getElementById('ddPool');
  var zonesEl = document.getElementById('ddZones');
  if (!pool || !zonesEl) return;

  pool.innerHTML = '';
  cur.items.filter(function(it){ return it.curZone === null; })
           .forEach(function(it){ pool.appendChild(chipEl(it)); });

  zonesEl.innerHTML = q.zones.map(function(z, zi){
    return '<div class="zone" data-z="' + zi + '" style="--zc:' + z.color + '">' +
             '<div class="zone-title">' + esc(z.name) + '</div>' +
             '<div class="zone-body" data-z="' + zi + '"></div>' +
           '</div>';
  }).join('');

  cur.items.filter(function(it){ return it.curZone !== null; })
           .forEach(function(it){
             var body = zonesEl.querySelector('.zone-body[data-z="' + it.curZone + '"]');
             if (body) body.appendChild(chipEl(it));
           });
}

function renderMatch(q){
  var left = q.pairs.map(function(p, i){ return { i:i, t:p.l, c:p.lc }; });
  var right = shuffle(q.pairs.map(function(p, i){ return { i:i, t:p.r }; }));
  state.cur = { type:'match', left:left, right:right, links:{}, sel:null };
  return '<div class="q-text">' + esc(q.q) + '</div>' +
         '<div class="match">' +
           '<div class="mcol" id="mLeft"></div>' +
           '<div class="mcol" id="mRight"></div>' +
         '</div>';
}

function paintMatch(q){
  var cur = state.cur;
  var L = document.getElementById('mLeft');
  var R = document.getElementById('mRight');
  if (!L || !R) return;
  L.innerHTML = '';
  R.innerHTML = '';

  cur.left.forEach(function(item){
    var d = document.createElement('div');
    d.className = 'mitem' +
      (cur.sel === item.i ? ' sel' : '') +
      (cur.links[item.i] !== undefined ? ' linked' : '');
    d.dataset.side = 'left';
    d.dataset.i = item.i;
    d.innerHTML = bsingle(item.t, item.c || 'looks');
    L.appendChild(d);
  });

  cur.right.forEach(function(item){
    var d = document.createElement('div');
    d.className = 'mitem';
    d.dataset.side = 'right';
    d.dataset.i = item.i;
    var leftKey = Object.keys(cur.links).filter(function(k){
      return cur.links[k] === item.i;
    })[0];
    var badge = (leftKey !== undefined)
      ? '<span class="badge">' + (parseInt(leftKey, 10) + 1) + '</span>'
      : '<span class="badge empty">?</span>';
    d.innerHTML = badge + '<span class="plain">' + esc(item.t) + '</span>';
    R.appendChild(d);
  });
}


/* ===== СБОРКА СКРИПТА КАК В SCRATCH 3 ===== */
var NODE={},E=null;
function renderOrder(q){
 var items=shuffle(q.items.map(function(it,i){var n={id:i,t:it.t,cat:it.c,k:kind(it.t),inner:[]};if(n.k==='c')n.cap=true;NODE[i]=n;return n;}));

 var cats=[['events','События'],['control','Управление'],['looks','Внешний вид']].map(function(c){return '<div><i style="background:'+CC[c[0]][0]+'"></i>'+c[1]+'</div>';}).join('');
 return '<div class="q-text">'+esc(q.q)+'</div><div class="note">🖱️ Перетаскивай блоки мышкой в область скриптов — они сами прицепляются друг к другу, как в Scratch 3. Блок можно вернуть обратно в палитру.</div>'+
 '<div class="ed"><div class="cats">'+cats+'</div><div class="pal" id="oPal"></div><div class="ws" id="oWs"><div class="wsbar">'+FLAG+STOP+'</div><div class="script-empty">Перетащи сюда блоки и собери скрипт</div></div></div>';}
function paintOrder(){var pal=document.getElementById('oPal'),ws=document.getElementById('oWs');if(!pal||!E)return;
 pal.innerHTML=E.pal.length?E.pal.map(function(n){return '<div class="pi">'+bhtml(n)+'</div>';}).join(''):'<div class="pe">Все блоки в скрипте ✔</div>';
 ws.querySelectorAll('.scr').forEach(function(x){x.remove();});
 E.scr.forEach(function(s){var d=document.createElement('div');d.className='scr';d.style.left=s.x+'px';d.style.top=s.y+'px';d.innerHTML=s.ch.map(bhtml).join('');ws.appendChild(d);});
 ws.classList.toggle('has',E.scr.length>0);}
function wk(l,id,s){for(var i=0;i<l.length;i++){if(l[i].id===id)return{list:l,i:i,s:s};var r=wk(l[i].inner||[],id,s);if(r)return r;}return null;}
function findList(id){for(var k=0;k<E.scr.length;k++){var r=wk(E.scr[k].ch,id,E.scr[k]);if(r)return r;}return null;}
function flat(ch){var o=[];ch.forEach(function(n){var i=n.inner||[];if(n.k==='c')n.inner=[];o.push(n);o=o.concat(flat(i));});return o;}
function dfs(ch){var o=[];ch.forEach(function(n){o.push(n);o=o.concat(dfs(n.inner||[]));});return o;}
function place(list,at,chain){var tail=list.splice(at),last=chain[chain.length-1];Array.prototype.push.apply(list,chain);
 if(tail.length){if(last.k==='c'&&!last.inner.length)last.inner=tail;else if(!last.cap)Array.prototype.push.apply(list,tail);else E.scr.push({x:20,y:230,ch:tail});}}

function cands(dr,chain){var best=null,bd=56,head=chain[0];
 document.getElementById('oWs').querySelectorAll('.b').forEach(function(el){var n=NODE[el.dataset.id],r=el.getBoundingClientRect(),f=findList(n.id);if(!f)return;
  function t(type,px,py,qx,qy){var d=Math.hypot(px-qx,py-qy);if(d<bd){bd=d;best={type:type,n:n,x:qx,y:qy};}}
  if(head.k!=='hat'&&!n.cap&&okTail(chain,f.i<f.list.length-1))t('after',dr.left,dr.top,r.left,r.bottom-6);
  if(n.k==='c'&&head.k!=='hat'&&okTail(chain,n.inner.length>0)){var cr=el.querySelector('.ct').getBoundingClientRect();t('inner',dr.left,dr.top,cr.left+18,cr.bottom-6);}
  if(f.i===0&&f.list===f.s.ch&&n.k!=='hat'){if(okTail(chain,true))t('top',dr.left,dr.bottom-6,r.left,r.top);
   if(chain.length===1&&head.k==='c'&&!head.inner.length)t('wrap',dr.left,dr.top,r.left-18,r.top-44);}

function inPal(ev,p){return ev.clientX>=p.left&&ev.clientX<=p.right&&ev.clientY>=p.top&&ev.clientY<=p.bottom;}

 else{var l=s.ch;for(;;){var L=l[l.length-1];if(L&&L.k==='c'){l=L.inner;if(!l.length){l.push(n);break;}continue;}l.push(n);break;}}

document.addEventListener('pointerdown',function(e){

  drag.d.style.left=(ev.clientX-(x0-r.left))+'px';drag.d.style.top=(ev.clientY-(y0-r.top))+'px';

questionArea.addEventListener('click', function(e){
  var cur = state.cur;
  if (!cur || state.locked) return;
  var q = QUESTIONS[state.idx];

  /* --- выбор варианта --- */
  if (cur.type === 'mc' || cur.type === 'tf') {
    var btn = e.target.closest('.opt');
    if (!btn) return;
    cur.selected = parseInt(btn.dataset.i, 10);
    questionArea.querySelectorAll('.opt').forEach(function(b){
      b.classList.toggle('sel', b === btn);
    });
    return;
  }

  /* --- drag & drop по категориям --- */
  if (cur.type === 'dd') {
    var chip = e.target.closest('.chip');
    var zoneEl = e.target.closest('.zone');

    if (chip) {
      var id = parseInt(chip.dataset.id, 10);
      var it = cur.items.filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      if (chip.parentElement.classList.contains('pool')) {
        cur.sel = (cur.sel === id) ? null : id;
      } else {
        it.curZone = null;
        cur.sel = null;
      }
      paintDD(q);
      return;
    }
    if (zoneEl && cur.sel !== null) {
      var it2 = cur.items.filter(function(x){ return x.id === cur.sel; })[0];
      if (it2) { it2.curZone = parseInt(zoneEl.dataset.z, 10); cur.sel = null; }
      paintDD(q);
    }
    return;
  }

  /* --- соответствие --- */
  if (cur.type === 'match') {
    var m = e.target.closest('.mitem');
    if (!m) return;
    var i = parseInt(m.dataset.i, 10);
    if (m.dataset.side === 'left') {
      cur.sel = (cur.sel === i) ? null : i;
    } else {
      if (cur.sel === null) return;
      Object.keys(cur.links).forEach(function(k){
        if (cur.links[k] === i) delete cur.links[k];
      });
      cur.links[cur.sel] = i;
      cur.sel = null;
    }
    paintMatch(q);
    return;
  }

  /* --- порядок блоков --- */
  if (cur.type === 'order') {
    var el = e.target.closest('[data-bid]');
    if (!el) return;
    var bid = parseInt(el.dataset.bid, 10);
    var pos = cur.placed.indexOf(bid);
    if (pos >= 0) cur.placed.splice(pos, 1);
    else cur.placed.push(bid);
    paintOrder(q);
  }
});

/* =========================================================
   DRAG & DROP (мышью)
   ========================================================= */
questionArea.addEventListener('dragstart', function(e){
  var chip = e.target.closest('.chip');
  if (!chip || state.locked) return;
  e.dataTransfer.setData('text/plain', chip.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  chip.classList.add('dragging');
});
questionArea.addEventListener('dragend', function(e){
  var chip = e.target.closest('.chip');
  if (chip) chip.classList.remove('dragging');
});
questionArea.addEventListener('dragover', function(e){
  if (e.target.closest('.zone') || e.target.closest('#ddPool')) e.preventDefault();
});
questionArea.addEventListener('drop', function(e){
  var cur = state.cur;
  if (!cur || cur.type !== 'dd' || state.locked) return;
  var raw = e.dataTransfer.getData('text/plain');
  if (raw === '' || raw === null) return;
  var id = parseInt(raw, 10);
  var it = cur.items.filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  e.preventDefault();
  var zoneEl = e.target.closest('.zone');
  if (zoneEl) it.curZone = parseInt(zoneEl.dataset.z, 10);
  else if (e.target.closest('#ddPool')) it.curZone = null;
  cur.sel = null;
  paintDD(QUESTIONS[state.idx]);
});

/* =========================================================
   ПОДСКАЗКА
   ========================================================= */

/* =========================================================
   ПРОВЕРКА ОТВЕТА
   ========================================================= */
function checkAnswer(){
  if (state.locked) return;
  var q = QUESTIONS[state.idx];
  var cur = state.cur;
  var ok = false, userText = '', correctText = '';

  /* --- тест --- */
  if (q.type === 'mc' || q.type === 'tf') {
    if (cur.selected === null) {
      feedbackEl.className = 'feedback bad';
      feedbackEl.innerHTML = '<div class="fb-title">👉 Выбери один ответ</div>' +
                             '<div class="fb-text">Нажми на один из вариантов, а потом нажми «Проверить».</div>';
      return;
    }
    var chosen = cur.options[cur.selected];
    ok = !!chosen.ok;
    userText = chosen.t;
    var rightOpt = cur.options.filter(function(o){ return o.ok; })[0];
    correctText = rightOpt ? rightOpt.t : '';

    questionArea.querySelectorAll('.opt').forEach(function(b){
      var o = cur.options[parseInt(b.dataset.i, 10)];
      b.classList.remove('sel');
      if (o.ok) b.classList.add('correct');
      else if (parseInt(b.dataset.i, 10) === cur.selected) b.classList.add('wrong');
      b.disabled = true;
    });
  }

  /* --- категории --- */
  else if (q.type === 'dd') {
    ok = cur.items.every(function(it){ return it.curZone === it.z; });
    userText = cur.items.map(function(it){
      return it.t + ' → ' + (it.curZone === null ? 'не распределено' : q.zones[it.curZone].name);
    }).join('; ');
    correctText = cur.items.map(function(it){
      return it.t + ' → ' + q.zones[it.z].name;
    }).join('; ');

    questionArea.querySelectorAll('.chip').forEach(function(ch){
      var it = cur.items.filter(function(x){ return x.id === parseInt(ch.dataset.id, 10); })[0];
      if (it && it.curZone !== it.z) ch.classList.add('wrong');
    });
  }

  /* --- соответствие --- */
  else if (q.type === 'match') {
    ok = q.pairs.every(function(p, i){ return cur.links[i] === i; });
    userText = q.pairs.map(function(p, i){
      var r = cur.links[i];
      var rightText = '—';
      if (r !== undefined) {
        var found = q.pairs[r];
        if (found) rightText = found.r;
      }
      return p.l + ' → ' + rightText;
    }).join('; ');
    correctText = q.pairs.map(function(p){ return p.l + ' → ' + p.r; }).join('; ');
    cur.sel = null;
    paintMatch(q);
  }

  /* --- порядок --- */
  else if (q.type === 'order') {
    var seq = cur.E.scr.length === 1 ? dfs(cur.E.scr[0].ch) : [];
    ok = cur.E.pal.length === 0 && cur.E.scr.length === 1 && seq.length === q.items.length &&
         seq.every(function(n, i){ return n.id === i; });
    userText = cur.E.scr.length
      ? cur.E.scr.map(function(sc){ return dfs(sc.ch).map(function(n){ return n.t; }).join(' → '); }).join(' | ')
      : 'ничего не выбрано';
    correctText = q.items.map(function(it){ return it.t; }).join(' → ');
  }

  /* --- фиксация (результат покажем только в конце) --- */
  state.locked = true;
  state.answers.push({ n: state.idx + 1, q: q.q, ok: ok, userText: userText, correctText: correctText, explain: q.explain });
}

checkBtn.addEventListener('click', checkAnswer);

nextBtn.addEventListener('click', function(){
  if (state.locked) return;
  var q = QUESTIONS[state.idx];
  if (!isDone(q)) {
    feedbackEl.className = 'feedback bad';
    feedbackEl.innerHTML = '<div class="fb-title">👉 Сначала выполни задание</div><div class="fb-text">Выбери ответ или выполни задание до конца, потом нажми «Далее».</div>';
    return;
  }
  checkAnswer();
  if (state.idx < QUESTIONS.length - 1) { state.idx++; renderQuestion(); window.scrollTo(0, 0); }
  else finish();
});

/* =========================================================
   ЭКРАН 3: ИТОГИ
   ========================================================= */
function finish(){
  show('screen-finish');

  var total = QUESTIONS.length;
  var correct = state.answers.filter(function(a){ return a.ok; }).length;
  var wrong = total - correct;
  state.log = state.log || []; state.log.push(correct + ' из ' + total);
  document.getElementById('statTry').textContent = state.tries || 1;
  document.getElementById('tryLog').textContent = 'Попытка №' + (state.tries || 1) +
    (state.log.length > 1 ? '. Твои результаты: ' + state.log.map(function(r, i){ return (i + 1) + ') ' + r; }).join(' · ') : '');

  document.getElementById('finishTitle').textContent = 'Отличная работа, ' + state.name + '!';
  document.getElementById('finishSub').textContent =
    (wrong === 0)
      ? 'Ты выполнил все задания без ошибок! 🎉'
      : 'Ты прошёл тренажер. Давай разберём, что стоит повторить.';

  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statScore').textContent = correct + ' из ' + total;

  var box = document.getElementById('mistakesBox');
  var wrongList = state.answers.filter(function(a){ return !a.ok; });

  if (wrongList.length === 0) {
    box.innerHTML = '<div class="all-good">🌟 Ошибок нет! Ты отлично разобрался с фонами и циклами в Scratch.</div>';
  } else {
    var html = '<h3>Разбор ошибок</h3>';
    wrongList.forEach(function(w){
      html +=
        '<div class="mistake">' +
          '<div class="m-num">Задание ' + w.n + '</div>' +
          '<div class="m-q">' + esc(w.q) + '</div>' +
          '<div class="m-row"><span class="lbl bad">Твой ответ: </span>' + esc(w.userText || '—') + '</div>' +
          '<div class="m-row"><span class="lbl good">Правильно: </span>' + esc(w.correctText) + '</div>' +
          '<div class="m-row m-exp">💡 ' + esc(w.explain) + '</div>' +
        '</div>';
    });
    box.innerHTML = html;
  }
  window.scrollTo(0, 0);
}

/* =========================================================
   ПРОЙТИ СНОВА
   ========================================================= */
document.getElementById('restartBtn').addEventListener('click', function(){
  state.tries = (state.tries || 1) + 1;
  state.idx = 0; state.answers = []; state.cur = null; state.locked = false;
  barFill.style.width = '0%';
  show('screen-quiz');
  renderQuestion();
});

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
document.getElementById('qTotal').textContent = QUESTIONS.length;
(function(){
  var h={id:0,t:'когда флажок нажат',cat:'events',k:'hat',inner:[]},
      c={id:1,t:'повторять всегда',cat:'control',k:'c',inner:[{id:2,t:'следующий фон',cat:'looks',k:'st',inner:[]},{id:3,t:'ждать 1 секунду',cat:'control',k:'st',inner:[]}]};
  document.querySelector('.logo-row').innerHTML='<svg class="cat" viewBox="0 0 100 100">'+SP.cat+'</svg><div class="logo-scr">'+bhtml(h)+bhtml(c)+'</div>';
  document.getElementById('finishTitle').insertAdjacentHTML('beforebegin','<div style="text-align:center"><svg width="120" height="120" viewBox="0 0 100 100">'+SP.cat+'</svg></div>');
})();
</script>
